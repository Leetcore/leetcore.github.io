<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<link rel="me" href="https://social.1337core.de/@1337core">
	<meta name="msvalidate.01" content="36C3B1D58591ACE5F478A0582EC01388" />
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta http-equiv="refresh" content="1;url=https://social.1337core.de">
	<title>Weiterleitung auf 1337core Blog</title>
	<style>
		:root {
			color-scheme: dark;
			--accent: #39ff88;
			--background: #000;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
			margin: 0;
			font-family: system-ui, sans-serif;
            font-size: 80%;
		}

		body {
			display: grid;
			min-height: 100vh;
			place-items: center;
			background: var(--background);
		}
        
        a, a:link, a:visited {
            color: var(--accent);
            text-decoration: none;
        }

		.loader {
            margin: 0 auto;
			width: 52px;
			height: 52px;
			border: 4px solid rgba(57, 255, 136, 0.22);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: spin 0.85s linear infinite;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.loader {
				animation-duration: 2s;
			}
		}
	</style>
</head>
<body>
    <div>
        <div class="loader" role="status" aria-label="Weiterleitung wird geladen..."></div>
        <br><br><br>
        <p>Sie werden automatisch weitergeleitet auf <a href="https://social.1337core.de">1337core Blog</a>...</p>
    </div>
</body>
</html>
